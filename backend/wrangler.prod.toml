main = "src/index.ts"
compatibility_date = "2024-01-01"

[[routes]]
pattern = "/api/*"
function = "src/index.ts"

[[d1_databases]]
binding = "DB"
database_name = "nova_commerce"
database_id = "e2e_test_d1"

[[r2_buckets]]
binding = "R2"
bucket_name = "nova-assets"
preview_bucket = "nova-assets-preview"

[vars]
NODE_ENV = "production"
JWT_SECRET = "your_super_secret_jwt_key_change_me_minimum_32_chars"
CLOUDFLARE_API_KEY = "your_api_key_here"

[observability]
enabled = true
