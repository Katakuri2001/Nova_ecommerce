version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nova_commerce
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nova:nova_secret@db:5432/nova_commerce
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_super_secret_jwt_key_change_me_minimum_32_chars
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
